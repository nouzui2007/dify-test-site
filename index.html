<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dify Tester</title>

  <link rel="stylesheet" href="auth.css">

  <!-- Markdown + Code highlight (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>

  <link rel="stylesheet" href="chat-style.css">
</head>
<body>

<header>
  <div class="logo">Dify<span>Tester</span></div>
  <div class="header-right">
    <span id="status-badge" class="status-badge"></span>
    <button id="auth-btn" class="btn" onclick="toggleLogin()"></button>
  </div>
</header>

<main>
  <div class="card">
    <p class="card-title">現在の状態</p>
    <div class="state-item">
      <label>ログイン状態</label>
      <div id="state-login" class="state-value"></div>
    </div>
  </div>

  <!-- 貼り付けるコード -->
  <div class="card" id="chat-card">
    <div class="chat-header">
      <p class="card-title">Chat</p>
      <button class="btn-reset-icon" onclick="resetChat()" title="会話リセット">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-thinking" class="chat-thinking" style="display:none">
      <span></span><span></span><span></span>
    </div>
    <div class="chat-input-row">
      <textarea id="chat-input" rows="1"
                placeholder="メッセージを入力… (Shift+Enter で改行)"
                oninput="autoResizeChatInput(this)"
                onkeydown="handleChatKey(event)"></textarea>
      <button class="btn-apply" id="chat-send-btn" onclick="sendMessage()">送信</button>
    </div>
    <div class="chat-footer">
      <span id="chat-conv-id" class="chat-conv-id"></span>
    </div>
  </div>

</main>

<script src="auth.js"></script>
<script>
  /* ── テスト用UI ── */
  function updateUI() {
    const loggedIn = isLoggedIn();

    const badge      = document.getElementById('status-badge');
    const btn        = document.getElementById('auth-btn');
    const stateLogin = document.getElementById('state-login');

    badge.textContent = loggedIn ? 'ログイン済み' : '未ログイン';
    badge.className   = `status-badge ${loggedIn ? 'logged-in' : 'logged-out'}`;
    btn.textContent   = loggedIn ? 'ログアウト' : 'ログイン';
    btn.className     = `btn ${loggedIn ? 'btn-logout' : 'btn-login'}`;

    stateLogin.textContent = loggedIn ? 'ログイン済み' : '未ログイン';
    stateLogin.className   = `state-value ${loggedIn ? 'is-logged-in' : 'is-logged-out'}`;
  }

  updateUI();

  /* ── サンプルログイン動作 ── */
  function toggleLogin() {
    if (isLoggedIn()) {
      deleteCookie('ckan');
    } else {
      setCookie('ckan', '.eJw9jsFqAzEMRP_F5y5YtizbuRUKJf8QCLIkk5BkEza7UCj99zoUepwZ5vG-3VGeSz-u94vNbueg1VB8TJqTeozB-yiIvRUMgYonIfASW3Vv7tgXe57cbl02G-ms467SCnTIHiEoSuyVJEPnwhyoFa0pmrFCzEyZLeYcTXPoJClpyRi0W4Doe2paKQU18VAxeRDA1HJlU_AJe0QVqlpIrRkVAEIMUl5aD1tuPNu8_qttT1v-_HpLlSHp5H3wE3KPUxnAiTR07iCkEQeD230bd_e-_9x_jCyXAfxap6vyY3rRxna68eW8yek89r5drzPfbNSHLQfKhy1BSe7nF7vsZd0.ahemWg.7gnWyk2KWJ_u0fvqucgMBjorAUs', 7);
    }
    location.reload();
  }
</script>
<script src="chat-app.js"></script>
</body>
</html>
