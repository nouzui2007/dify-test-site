<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dify Tester</title>

  <!-- Dify config — must run before embed script -->
  <script>
    function getCookie(name) {
      const key = encodeURIComponent(name) + '=';
      for (const part of document.cookie.split('; ')) {
        if (part.startsWith(key)) return decodeURIComponent(part.slice(key.length));
      }
      return null;
    }

    function setupDifyConfig(opts) {
      window.difyChatbotConfig = {
        token: 'zjGMPbx4WpS2RhER',
        inputs: opts.inputs || {},
        systemVariables: opts.userId ? { user_id: opts.userId } : {},
        userVariables: {},
      };
    }

    (function () {
      let inputs = { is_logged_in: 'False', hoge: 'fuga' };
      try {
        const saved = JSON.parse(localStorage.getItem('dify_inputs'));
        if (saved && typeof saved === 'object') inputs = saved;
      } catch (e) {}
      setupDifyConfig({ inputs, userId: getCookie('dify_tester_user_id') || '' });
    })();
  </script>
  <script src="https://udify.app/embed.min.js" id="zjGMPbx4WpS2RhER" defer></script>
  <!-- Markdown + Code highlight -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      marked.setOptions({
        highlight: function(code, lang) {
          const language = hljs.getLanguage(lang) ? lang : 'plaintext';
          return hljs.highlight(code, { language }).value;
        },
        langPrefix: 'hljs language-',
        breaks: true,
      });
    });
  </script>

  <style>
    #dify-chatbot-bubble-button { background-color: #1C64F2 !important; }
    #dify-chatbot-bubble-window { width: 24rem !important; height: 40rem !important; }
  </style>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #333;
    }

    /* ── Header ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }

    .logo span { color: #6c63ff; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .status-badge.logged-out { background: #fef3c7; color: #92400e; }
    .status-badge.logged-in  { background: #d1fae5; color: #065f46; }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active      { transform: scale(0.97); }
    .btn-login       { background: #6c63ff; color: #fff; }
    .btn-login:hover { background: #5a52d5; }
    .btn-logout       { background: #ef4444; color: #fff; }
    .btn-logout:hover { background: #dc2626; }

    /* ── Main ── */
    main {
      max-width: 760px;
      margin: 36px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #6c63ff;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }

    /* ── State panel ── */
    .state-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .state-item {
      background: #f8f9fb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .state-item label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .state-value { font-size: 14px; font-weight: 600; }
    .state-value.is-logged-in  { color: #059669; }
    .state-value.is-logged-out { color: #d97706; }
    .state-value.is-user       { color: #6c63ff; font-family: monospace; }
    .state-value.is-none       { color: #9ca3af; font-style: italic; }

    /* ── Config panel ── */
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .config-field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
      font-family: monospace;
    }

    .config-field textarea,
    .config-field input[type="text"] {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
      resize: vertical;
    }

    .config-field textarea:focus,
    .config-field input[type="text"]:focus { border-color: #6c63ff; }

    .config-field textarea.error { border-color: #ef4444; }

    .config-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-apply {
      padding: 8px 20px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-apply:hover  { background: #5a52d5; }
    .btn-apply:active { transform: scale(0.97); }

    .btn-reset {
      padding: 8px 20px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-reset:hover  { background: #dc2626; }
    .btn-reset:active { transform: scale(0.97); }

    .config-error {
      font-size: 12px;
      color: #ef4444;
      display: none;
    }

    .config-error.visible { display: block; }

    /* ── Chat card ── */
    #chat-card { display: flex; flex-direction: column; gap: 12px; }

    #chat-messages {
      max-height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 0;
    }

    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .chat-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: #6c63ff;
      color: #fff;
      border-bottom-right-radius: 3px;
      white-space: pre-wrap;
    }

    .chat-bubble.assistant {
      align-self: flex-start;
      background: #f0f2f5;
      color: #333;
      border-bottom-left-radius: 3px;
    }

    .chat-bubble.assistant p  { margin: 0 0 8px; }
    .chat-bubble.assistant p:last-child { margin-bottom: 0; }
    .chat-bubble.assistant ul,
    .chat-bubble.assistant ol { padding-left: 1.4em; margin: 4px 0 8px; }
    .chat-bubble.assistant li { margin-bottom: 2px; }
    .chat-bubble.assistant h1,
    .chat-bubble.assistant h2,
    .chat-bubble.assistant h3 { margin: 8px 0 4px; font-size: 1em; }
    .chat-bubble.assistant a  { color: #6c63ff; }
    .chat-bubble.assistant code {
      background: #e8eaf6;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 12px;
      font-family: monospace;
    }
    .chat-bubble.assistant pre {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 10px 14px;
      overflow-x: auto;
      margin: 6px 0;
    }
    .chat-bubble.assistant pre code {
      background: none;
      padding: 0;
      font-size: 12px;
    }

    .chat-thinking {
      align-self: flex-start;
      display: flex;
      gap: 5px;
      padding: 10px 14px;
    }
    .chat-thinking span {
      width: 7px; height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1s infinite ease-in-out;
    }
    .chat-thinking span:nth-child(1) { animation-delay: 0s; }
    .chat-thinking span:nth-child(2) { animation-delay: 0.15s; }
    .chat-thinking span:nth-child(3) { animation-delay: 0.30s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-6px); opacity: 1; }
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .chat-input-row textarea {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      overflow-y: hidden;
      min-height: 38px;
      max-height: 120px;
      transition: border-color 0.15s;
    }
    .chat-input-row textarea:focus { border-color: #6c63ff; }

    .chat-footer {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-conv-id {
      font-size: 11px;
      font-family: monospace;
      color: #9ca3af;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Dify<span>Tester</span></div>
  <div class="header-right">
    <span id="status-badge" class="status-badge"></span>
    <button id="auth-btn" class="btn" onclick="toggleLogin()"></button>
  </div>
</header>

<main>
  <div class="card">
    <p class="card-title">現在の状態</p>
    <div class="state-grid">
      <div class="state-item">
        <label>ログイン状態</label>
        <div id="state-login" class="state-value"></div>
      </div>
      <div class="state-item">
        <label>systemVariables.user_id</label>
        <div id="state-user" class="state-value"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="card-title">Dify Config</p>
    <div class="config-grid">
      <div class="config-field">
        <label>inputs (JSON)</label>
        <textarea id="cfg-inputs" rows="6" spellcheck="false"></textarea>
      </div>
      <div class="config-field">
        <label>systemVariables.user_id</label>
        <input id="cfg-user-id" type="text" placeholder="（空欄で省略）">
      </div>
    </div>
    <div class="config-field" style="margin-bottom: 14px;">
      <label>Chat API Key</label>
      <input id="cfg-api-key" type="password" placeholder="sk-xxxxxxxxxx" autocomplete="off">
    </div>
    <div class="config-actions">
      <button class="btn-apply" onclick="applyConfig()">適用</button>
      <button class="btn-reset" onclick="resetConversation()">会話リセット</button>
      <span id="cfg-error" class="config-error">inputs が有効な JSON ではありません</span>
    </div>
  </div>

  <div class="card" id="chat-card">
    <p class="card-title">Chat</p>
    <div id="chat-messages"></div>
    <div id="chat-thinking" class="chat-thinking" style="display:none">
      <span></span><span></span><span></span>
    </div>
    <div class="chat-input-row">
      <textarea id="chat-input" rows="1"
                placeholder="メッセージを入力… (Shift+Enter で改行)"
                oninput="autoResizeChatInput(this)"
                onkeydown="handleChatKey(event)"></textarea>
      <button class="btn-apply" id="chat-send-btn" onclick="sendMessage()">送信</button>
    </div>
    <div class="chat-footer">
      <button class="btn-reset" onclick="resetChat()">会話リセット</button>
      <span id="chat-conv-id" class="chat-conv-id"></span>
    </div>
  </div>
</main>

<script>
  /* ── Cookie helpers ── */
  function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days * 864e5).toUTCString();
    document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
  }

  function deleteCookie(name) {
    document.cookie = `${encodeURIComponent(name)}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax`;
  }

  function isLoggedIn() {
    return getCookie('dify_tester_auth') === 'true';
  }

  /* ── iframe の src を書き換えて inputs を反映 ── */
  function updateDifyEmbed() {
    const iframe = document.getElementById('dify-chatbot-bubble-window');
    if (!iframe) return;

    const inputs = window.difyChatbotConfig?.inputs || {};
    const params = new URLSearchParams();
    Object.entries(inputs).forEach(([key, value]) => {
      params.set(key, btoa(unescape(encodeURIComponent(String(value)))));
    });

    iframe.src = `https://udify.app/chatbot/zjGMPbx4WpS2RhER?${params.toString()}`;
    // iframe.contentWindow.location.reload();
  }

  /* ── Dify embed 要素削除 ── */
  function removeDifyEmbed() {
    ['dify-chatbot-bubble-button', 'dify-chatbot-bubble-window'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.remove();
    });
    const old = document.getElementById('zjGMPbx4WpS2RhER');
    if (old) old.remove();
  }

  /* ── 会話リセット：user_id にタイムスタンプを付与して別会話として扱わせる ── */
  function resetConversation() {
    const baseUserId = getCookie('dify_tester_user_id') || '';
    const sessionUserId = (baseUserId || 'user') + '-' + Date.now();
    const currentInputs = window.difyChatbotConfig ? { ...window.difyChatbotConfig.inputs } : {};
    setupDifyConfig({ inputs: currentInputs, userId: sessionUserId });
    updateDifyEmbed();
    if (typeof resetChat === 'function') resetChat();
    // location.reload();
  }

  /* ── Apply config ── */
  function applyConfig() {
    const textarea = document.getElementById('cfg-inputs');
    const errEl    = document.getElementById('cfg-error');
    const userId   = document.getElementById('cfg-user-id').value.trim();

    let inputs;
    try {
      inputs = JSON.parse(textarea.value);
      if (typeof inputs !== 'object' || Array.isArray(inputs)) throw new Error();
    } catch (e) {
      textarea.classList.add('error');
      errEl.classList.add('visible');
      return;
    }
    textarea.classList.remove('error');
    errEl.classList.remove('visible');

    localStorage.setItem('dify_inputs', JSON.stringify(inputs));
    if (userId) {
      setCookie('dify_tester_user_id', userId, 7);
    } else {
      deleteCookie('dify_tester_user_id');
    }

    const apiKey = document.getElementById('cfg-api-key').value.trim();
    if (apiKey) localStorage.setItem('dify_api_key', apiKey);

    if (typeof resetChat === 'function') resetChat();
    setupDifyConfig({ inputs, userId });
    updateDifyEmbed();
    // location.reload();
    // updateUI();
  }

  /* ── UI update ── */
  function updateUI() {
    const loggedIn = isLoggedIn();
    const userId   = getCookie('dify_tester_user_id') || '';

    const badge      = document.getElementById('status-badge');
    const btn        = document.getElementById('auth-btn');
    const stateLogin = document.getElementById('state-login');
    const stateUser  = document.getElementById('state-user');

    badge.textContent = loggedIn ? 'ログイン済み' : '未ログイン';
    badge.className   = `status-badge ${loggedIn ? 'logged-in' : 'logged-out'}`;
    btn.textContent   = loggedIn ? 'ログアウト' : 'ログイン';
    btn.className     = `btn ${loggedIn ? 'btn-logout' : 'btn-login'}`;

    stateLogin.textContent = loggedIn ? 'ログイン済み' : '未ログイン';
    stateLogin.className   = `state-value ${loggedIn ? 'is-logged-in' : 'is-logged-out'}`;

    if (userId) {
      stateUser.textContent = `"${userId}"`;
      stateUser.className   = 'state-value is-user';
    } else {
      stateUser.textContent = 'なし（未送信）';
      stateUser.className   = 'state-value is-none';
    }

    let inputs = { is_logged_in: 'False', hoge: 'fuga' };
    try {
      const saved = JSON.parse(localStorage.getItem('dify_inputs'));
      if (saved && typeof saved === 'object') inputs = saved;
    } catch (e) {}
    document.getElementById('cfg-inputs').value = JSON.stringify(inputs, null, 2);
    document.getElementById('cfg-user-id').value = userId;
    document.getElementById('cfg-api-key').value =
      window.__ENV__?.DIFY_API_KEY || localStorage.getItem('dify_api_key') || '';
  }

  /* ── Login / Logout ── */
  function toggleLogin() {
    if (isLoggedIn()) {
      deleteCookie('dify_tester_auth');
    } else {
      setCookie('dify_tester_auth', 'true', 7);
    }
    location.reload();
  }

  updateUI();
</script>


<script>
  /* ── Chat state ── */
  const DIFY_CHAT_API = 'https://udify.app/v1/chat-messages';
  let conversationId         = '';
  let isStreaming             = false;
  let currentAbortController = null;

  /* ── Input auto-resize ── */
  function autoResizeChatInput(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleChatKey(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  }

  /* ── Scroll ── */
  function scrollToBottom() {
    const container = document.getElementById('chat-messages');
    container.scrollTop = container.scrollHeight;
  }

  /* ── Markdown render ── */
  function renderMarkdown(text) {
    try {
      return marked.parse(text);
    } catch (e) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    }
  }

  /* ── Message DOM helpers ── */
  function appendUserMessage(text) {
    const container = document.getElementById('chat-messages');
    const bubble    = document.createElement('div');
    bubble.className   = 'chat-bubble user';
    bubble.textContent = text;
    container.appendChild(bubble);
    scrollToBottom();
  }

  function appendAssistantBubble() {
    const container = document.getElementById('chat-messages');
    const bubble    = document.createElement('div');
    bubble.className   = 'chat-bubble assistant';
    bubble.dataset.raw = '';
    container.appendChild(bubble);
    scrollToBottom();
    return bubble;
  }

  function updateAssistantBubble(bubble, rawText) {
    bubble.dataset.raw = rawText;
    bubble.innerHTML   = renderMarkdown(rawText);
    bubble.querySelectorAll('pre code').forEach(block => {
      if (!block.dataset.highlighted) {
        hljs.highlightElement(block);
        block.dataset.highlighted = 'yes';
      }
    });
    scrollToBottom();
  }

  /* ── Streaming state ── */
  function setStreamingState(active) {
    isStreaming = active;
    document.getElementById('chat-thinking').style.display = active ? 'flex' : 'none';
    document.getElementById('chat-send-btn').disabled      = active;
    document.getElementById('chat-input').disabled         = active;
  }

  /* ── Send message ── */
  async function sendMessage() {
    if (isStreaming) return;

    const inputEl = document.getElementById('chat-input');
    const query   = inputEl.value.trim();
    if (!query) return;

    const apiKey = window.__ENV__?.DIFY_API_KEY || localStorage.getItem('dify_api_key') || '';
    if (!apiKey) {
      alert('Chat API Key が設定されていません。Dify Config カードで入力して「適用」してください。');
      return;
    }

    const inputs = window.difyChatbotConfig?.inputs || {};
    const user   = window.difyChatbotConfig?.systemVariables?.user_id
                     || getCookie('dify_tester_user_id')
                     || 'anonymous';

    inputEl.value = '';
    autoResizeChatInput(inputEl);

    appendUserMessage(query);
    setStreamingState(true);

    const assistantBubble = appendAssistantBubble();
    let   accumulated     = '';

    currentAbortController = new AbortController();

    try {
      const response = await fetch(DIFY_CHAT_API, {
        method:  'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type':  'application/json',
        },
        body: JSON.stringify({
          query,
          response_mode:   'streaming',
          user,
          conversation_id: conversationId,
          inputs,
        }),
        signal: currentAbortController.signal,
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errText}`);
      }

      const reader  = response.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const jsonStr = line.slice(6).trim();
          if (!jsonStr || jsonStr === '[DONE]') continue;

          let evt;
          try { evt = JSON.parse(jsonStr); } catch { continue; }

          if (evt.event === 'message' && evt.answer != null) {
            accumulated += evt.answer;
            updateAssistantBubble(assistantBubble, accumulated);
          }

          if (evt.event === 'message_end') {
            if (evt.conversation_id) {
              conversationId = evt.conversation_id;
              document.getElementById('chat-conv-id').textContent =
                'conv: ' + conversationId;
            }
            updateAssistantBubble(assistantBubble, accumulated);
          }

          if (evt.event === 'error') {
            throw new Error(evt.message || 'Dify API error');
          }
        }
      }

    } catch (err) {
      if (err.name !== 'AbortError') {
        assistantBubble.innerHTML =
          `<span style="color:#ef4444">エラー: ${err.message}</span>`;
        console.error('[DifyChat]', err);
      }
    } finally {
      setStreamingState(false);
      currentAbortController = null;
    }
  }

  /* ── Reset chat ── */
  function resetChat() {
    if (currentAbortController) {
      currentAbortController.abort();
      currentAbortController = null;
    }
    conversationId = '';
    isStreaming    = false;
    document.getElementById('chat-messages').innerHTML  = '';
    document.getElementById('chat-conv-id').textContent = '';
    document.getElementById('chat-thinking').style.display = 'none';
    document.getElementById('chat-send-btn').disabled      = false;
    document.getElementById('chat-input').disabled         = false;
  }
</script>
</body>
</html>
