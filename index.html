<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dify Tester</title>

  <!-- Dify config — must run before embed script -->
  <script>
    window.difyChatbotConfig = {
      token: 'zjGMPbx4WpS2RhER',
      inputs: {
        is_logged_in: "False",
        hoge: "fuga",
      },
      systemVariables: {
        // user_id: 'YOU CAN DEFINE USER ID HERE',
        // conversation_id: 'YOU CAN DEFINE CONVERSATION ID HERE, IT MUST BE A VALID UUID',
      },
      userVariables: {
        // avatar_url: 'YOU CAN DEFINE USER AVATAR URL HERE',
        // name: 'YOU CAN DEFINE USER NAME HERE',
      },
    };
  </script>
  <script src="https://udify.app/embed.min.js" id="zjGMPbx4WpS2RhER" defer></script>
  <style>
    #dify-chatbot-bubble-button { background-color: #1C64F2 !important; }
    #dify-chatbot-bubble-window { width: 24rem !important; height: 40rem !important; }
  </style>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #333;
    }

    /* ── Header ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }

    .logo span { color: #6c63ff; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .status-badge.logged-out { background: #fef3c7; color: #92400e; }
    .status-badge.logged-in  { background: #d1fae5; color: #065f46; }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn-login:hover  { background: #5a52d5; }
    .btn-logout:hover { background: #dc2626; }
    .btn-login  { background: #6c63ff; color: #fff; }
    .btn-logout { background: #ef4444; color: #fff; }

    /* ── Main ── */
    main {
      max-width: 760px;
      margin: 36px auto;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #6c63ff;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }

    /* ── State panel ── */
    .state-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .state-item {
      background: #f8f9fb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .state-item label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .state-value { font-size: 14px; font-weight: 600; }
    .state-value.is-logged-in  { color: #059669; }
    .state-value.is-logged-out { color: #d97706; }
    .state-value.is-user       { color: #6c63ff; font-family: monospace; }
    .state-value.is-none       { color: #9ca3af; font-style: italic; }

    /* user ID row */
    .user-id-row {
      margin-top: 14px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .user-id-row.visible { display: flex; }

    .user-id-row label {
      font-size: 13px;
      color: #374151;
      white-space: nowrap;
      font-weight: 500;
    }

    .user-id-row input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    .user-id-row input:focus { border-color: #6c63ff; }

    .btn-apply-user {
      padding: 7px 14px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-apply:hover  { background: #5a52d5; }
    .btn-apply:active { transform: scale(0.97); }

    .btn-reset {
      padding: 8px 20px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-reset:hover  { background: #dc2626; }
    .btn-reset:active { transform: scale(0.97); }

    .config-error {
      font-size: 12px;
      color: #ef4444;
      display: none;
    }

    .config-error.visible { display: block; }
  </style>
</head>
<body>

<header>
  <div class="logo">Dify<span>Tester</span></div>
  <div class="header-right">
    <span id="status-badge" class="status-badge"></span>
    <button id="auth-btn" class="btn" onclick="toggleLogin()"></button>
  </div>
</header>

<main>
  <div class="card">
    <p class="card-title">現在の状態</p>
    <div class="state-grid">
      <div class="state-item">
        <label>ログイン状態</label>
        <div id="state-login" class="state-value"></div>
      </div>
      <div class="state-item">
        <label>Dify へ送信する user_id</label>
        <div id="state-user" class="state-value"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="card-title">Dify Config</p>
    <div class="config-grid">
      <div class="config-field">
        <label>inputs (JSON)</label>
        <textarea id="cfg-inputs" rows="6" spellcheck="false"></textarea>
      </div>
      <div class="config-field">
        <label>systemVariables.user_id</label>
        <input id="cfg-user-id" type="text" placeholder="（空欄で省略）">
      </div>
    </div>
    <div class="config-actions">
      <button class="btn-apply" onclick="applyConfig()">適用</button>
      <button class="btn-reset" onclick="resetConversation()">会話リセット</button>
      <span id="cfg-error" class="config-error">inputs が有効な JSON ではありません</span>
    </div>
  </div>
</main>

<script>
  /* ── Cookie helpers ── */
  function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days * 864e5).toUTCString();
    document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
  }

  function getCookie(name) {
    const key = encodeURIComponent(name) + '=';
    for (const part of document.cookie.split('; ')) {
      if (part.startsWith(key)) return decodeURIComponent(part.slice(key.length));
    }
    return null;
  }

  function deleteCookie(name) {
    document.cookie = `${encodeURIComponent(name)}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax`;
  }

  function isLoggedIn() {
    return getCookie('dify_tester_auth') === 'true';
  }

  /* ── Dify embed 再起動（ボタン削除 → スクリプト再挿入） ── */
  function reloadDifyEmbed() {
    ['dify-chatbot-bubble-button', 'dify-chatbot-bubble-window'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.remove();
    });
    const old = document.getElementById('zjGMPbx4WpS2RhER');
    if (old) old.remove();
    const script = document.createElement('script');
    script.src = 'https://udify.app/embed.min.js';
    script.id  = 'zjGMPbx4WpS2RhER';
    document.body.appendChild(script);
  }

  /* ── 会話リセット：user_id にタイムスタンプを付与して別会話として扱わせる ── */
  function resetConversation() {
    const baseUserId = getCookie('dify_tester_user_id') || '';
    const sessionUserId = (baseUserId || 'user') + '-' + Date.now();
    const currentInputs = window.difyChatbotConfig ? { ...window.difyChatbotConfig.inputs } : {};
    setupDifyConfig({ inputs: currentInputs, userId: sessionUserId });
    reloadDifyEmbed();
  }

  /* ── Apply config ── */
  function applyConfig() {
    const textarea = document.getElementById('cfg-inputs');
    const errEl    = document.getElementById('cfg-error');
    const userId   = document.getElementById('cfg-user-id').value.trim();

    let inputs;
    try {
      inputs = JSON.parse(textarea.value);
      if (typeof inputs !== 'object' || Array.isArray(inputs)) throw new Error();
    } catch (e) {
      textarea.classList.add('error');
      errEl.classList.add('visible');
      return;
    }
    textarea.classList.remove('error');
    errEl.classList.remove('visible');

    localStorage.setItem('dify_inputs', JSON.stringify(inputs));
    if (userId) {
      setCookie('dify_tester_user_id', userId, 7);
    } else {
      deleteCookie('dify_tester_user_id');
    }

    setupDifyConfig({ inputs, userId });
    reloadDifyEmbed();
    updateUI();
  }

  /* ── UI update ── */
  function updateUI() {
    const loggedIn   = isLoggedIn();
    const userId     = getCookie('dify_tester_user_id') || 'test-user';
    const badge      = document.getElementById('status-badge');
    const btn        = document.getElementById('auth-btn');
    const stateLogin = document.getElementById('state-login');
    const stateUser  = document.getElementById('state-user');
    const userIdRow  = document.getElementById('user-id-row');
    const input      = document.getElementById('user-id-input');

    if (loggedIn) {
      badge.textContent = 'ログイン済み';
      badge.className   = 'status-badge logged-in';
      btn.textContent   = 'ログアウト';
      btn.className     = 'btn btn-logout';

      stateLogin.textContent = 'ログイン済み';
      stateLogin.className   = 'state-value is-logged-in';

      stateUser.textContent = `"${userId}"`;
      stateUser.className   = 'state-value is-user';

      input.value = userId;
      userIdRow.classList.add('visible');
    } else {
      badge.textContent = '未ログイン';
      badge.className   = 'status-badge logged-out';
      btn.textContent   = 'ログイン';
      btn.className     = 'btn btn-login';

      stateLogin.textContent = '未ログイン';
      stateLogin.className   = 'state-value is-logged-out';

      stateUser.textContent = 'なし（未送信）';
      stateUser.className   = 'state-value is-none';

    // Populate config form
    let inputs = { is_logged_in: "False", hoge: 'hhhh' };
    try {
      const saved = JSON.parse(localStorage.getItem('dify_inputs'));
      if (saved && typeof saved === 'object') inputs = saved;
    } catch (e) {}
    document.getElementById('cfg-inputs').value = JSON.stringify(inputs, null, 2);
    document.getElementById('cfg-user-id').value = userId;
  }

  /* ── Login / Logout ── */
  function toggleLogin() {
    if (isLoggedIn()) {
      deleteCookie('dify_tester_auth');
    } else {
      setCookie('dify_tester_auth', 'true', 7);
    }
    location.reload();
  }

  /* ── Apply User ID ── */
  function applyUserId() {
    const val = document.getElementById('user-id-input').value.trim() || 'test-user';
    setCookie('dify_tester_user_id', val, 7);
    location.reload();
  }

  updateUI();
</script>

</body>
</html>
